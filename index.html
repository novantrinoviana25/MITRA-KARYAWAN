const KEY = 'mk_k1', LAST = 'mk_t1', IDLE = (P.idle || 30) * 60000;
let mem = Date.now();
const lastTs = () => { let v = 0; try { v = Number(localStorage.getItem(LAST)) || 0; } catch (_) {} return Math.max(v, mem); };
const touch = () => { mem = Date.now(); try { localStorage.setItem(LAST, String(mem)); } catch (_) {} };
const enc = new TextEncoder(), $ = id => document.getElementById(id);
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = u => { let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
const hex = u => [...u].map(x => x.toString(16).padStart(2, '0')).join('');
const norm = s => String(s).trim().toLowerCase();
const store = { get: () => { try { return localStorage.getItem(KEY); } catch (_) { return null; } }, set: v => { try { localStorage.setItem(KEY, v); } catch (_) {} }, del: () => { try { localStorage.removeItem(KEY); } catch (_) {} } };

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) { navigator.serviceWorker.register('sw.js').catch(() => {}); }

async function idHash(id) { return hex(new Uint8Array(await crypto.subtle.digest('SHA-256', enc.encode(P.gs + ':' + norm(id))))); }
async function deriveKey(pw, salt) {
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);

    const key = await deriveKey(pw, b64d(e.s));
    return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(e.i) }, key, b64d(e.w)));
  } catch (_) { return null; }

async function openApp(raw) {

}
function launch(html) {
  document.open(); document.write(html); document.close();
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = 'Keluar';
  b.style.cssText = 'position:fixed;top:6px;right:6px;z-index:99999;font:600 11px system-ui,sans-serif;padding:4px 9px;border-radius:99px;border:1px solid rgba(0,0,0,.15);background:rgba(255,255,255,.85);color:#334155;cursor:pointer;opacity:.75';

  (document.body || document.documentElement).appendChild(b);

  const act = () => { const n = Date.now(); if (n - tt > 5000) { tt = n; touch(); } };

  document.addEventListener('visibilitychange', () => { if (!document.hidden) chk(); });

}

  $('f').style.display = 'none'; $('load').style.display = 'block';
  openApp(b64d(saved)).then(launch).catch(() => { store.del(); $('load').style.display = 'none'; $('f').style.display = ''; });
}
$('eye').addEventListener('click', () => { const p = $('p'); const s = p.type === 'password'; p.type = s ? 'text' : 'password'; $('eye').textContent = s ? 'Sembunyi' : 'Lihat'; });
$('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const go = $('go'), err = $('err'); err.textContent = ''; go.disabled = true; go.textContent = 'Memeriksa…';

    if (!(window.crypto && crypto.subtle)) throw new Error('Browser tidak mendukung. Gunakan Chrome versi terbaru.');
    const raw = await masterFromLogin($('u').value, $('p').value);
